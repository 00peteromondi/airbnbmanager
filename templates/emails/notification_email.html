<div style="font-family:Arial,sans-serif;max-width:620px;margin:0 auto;padding:24px;background:#fff7f4;">
    <div style="background:linear-gradient(135deg,#cf2338,#f97316);padding:22px;border-radius:18px 18px 0 0;color:#ffffff;">
        <h1 style="margin:0;font-size:26px;">{{ title }}</h1>
        <p style="margin:12px 0 0;opacity:0.88;">BayStays immediate update</p>
    </div>
    <div style="background:#ffffff;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 18px 18px;padding:24px 22px;">
        <p style="margin:0 0 16px;color:#0f172a;">Hi {{ user.get_display_name }},</p>
        <p style="margin:0 0 18px;color:#475569;line-height:1.7;">{{ body }}</p>
        <a href="{{ action_url }}" style="display:inline-flex;padding:12px 18px;border-radius:12px;background:#cf2338;color:#ffffff;text-decoration:none;font-weight:700;">{{ action_label }}</a>
    </div>
</div>
