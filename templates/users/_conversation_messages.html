{% load humanize %}

{% for message in messages %}
    <div class="message-bubble {% if message.sender_id == request.user.id %}message-bubble--own{% else %}message-bubble--other{% endif %}">
        <p class="text-xs uppercase tracking-[0.24em] {% if message.sender_id == request.user.id %}text-red-500{% else %}text-slate-500{% endif %}">{{ message.sender.get_display_name }}</p>
        <p class="mt-2 text-slate-700 whitespace-pre-line">{{ message.body }}</p>
        <p class="mt-3 text-xs text-slate-500">{{ message.created_at|date:"M d, Y · H:i" }}</p>
    </div>
{% empty %}
    <div class="empty-state rounded-[1rem] px-6 py-10">
        <div>
            <i class="fa-solid fa-comments text-3xl text-blue-500"></i>
            <p class="mt-4 font-semibold text-slate-800">No messages yet</p>
            <p class="text-sm text-slate-500 mt-2">Use this thread to coordinate everything about the stay without leaving BayStays.</p>
        </div>
    </div>
{% endfor %}
