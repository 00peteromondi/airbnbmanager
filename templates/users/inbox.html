{% extends 'base.html' %}
{% block title %}Inbox | BayStays{% endblock %}
{% block content %}
<section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14 space-y-8">
    <div class="live-panel inbox-shell" data-live-region data-live-url="{% url 'users:inbox_live' %}" data-live-version="{{ live_version }}" data-live-poll-interval="8000" data-live-group="user-alerts-{{ request.user.id }}">
        <div data-live-content>
            {% include 'users/_inbox_content.html' %}
        </div>
    </div>
</section>
{% endblock %}
